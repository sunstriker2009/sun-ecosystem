name: Symbol approval ledger validation
on:
  pull_request:
    paths:
      - 'registry/symbol-approvals.json'
      - 'registry/repositories.json'
      - '.github/workflows/symbol-approval-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approval ledger shape and registry membership
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          approvals=json.loads(Path('registry/symbol-approvals.json').read_text())
          catalog=json.loads(Path('registry/repositories.json').read_text())
          assert approvals['schemaVersion']==1
          approved={r['repository'] for r in catalog['repositories'] if r['classification']!='pending'}
          seen=set()
          for entry in approvals['approvedSymbols']:
              repo=entry['repository']
              assert repo in approved and repo not in seen
              seen.add(repo)
              assert entry['source']=='branding/assets/symbol.png'
              assert re.fullmatch(r'[0-9a-f]{64}',entry['sha256'])
              assert isinstance(entry.get('approval'),str) and entry['approval'].strip()
          PY
