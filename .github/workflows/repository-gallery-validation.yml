name: Repository gallery validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify links to the Foundry registry and gallery
        shell: bash
        run: |
          set -euo pipefail
          foundry=https://github.com/sunstriker2009/sun-foundry/blob/main/registry
          for file in GALLERY.md PRODUCTS.md INFRASTRUCTURE.md products.json; do
            grep -Fq "$foundry/$file)" README.md
          done
          for file in products.json repositories.json symbol-approvals.json; do
            test ! -e "registry/$file"
          done
