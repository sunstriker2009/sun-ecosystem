name: Repository gallery validation
on:
  pull_request:
    paths:
      - 'registry/repositories.json'
      - 'registry/products.json'
      - 'branding/registry/**'
      - 'scripts/render-repository-gallery.py'
      - 'README.md'
      - '.github/workflows/repository-gallery-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify catalog, approved IDs, icon integrity and generated README
        run: python scripts/render-repository-gallery.py --check
